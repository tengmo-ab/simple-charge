name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check manifest version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c 'import json;print(json.load(open("custom_components/simple_charge/manifest.json"))["version"])')
          test "$tag" = "$version" || { echo "Tag $tag != manifest $version"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
